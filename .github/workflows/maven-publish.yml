# GitHub Actions 自动构建和发布 Maven 包
# 
# 触发条件：
#   - 推送到 main/master 分支
#   - 创建 Release/Tag
#   - 手动触发
#
# 发布到：
#   - GitHub Packages (自动)
#   - Maven Central (需要配置 OSSRH 凭据)

name: Maven Build & Publish

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]
  workflow_dispatch:  # 允许手动触发

jobs:
  # 构建和测试
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B clean compile --file pom.xml

    - name: Run tests
      run: mvn -B test --file pom.xml
      continue-on-error: true  # 即使测试失败也继续

    - name: Package JAR
      run: mvn -B package -DskipTests --file pom.xml

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: jsonrpc-jar
        path: target/*.jar
        retention-days: 7

  # 发布到 GitHub Packages
  publish-github:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
        server-id: github
        settings-path: ${{ github.workspace }}

    - name: Publish to GitHub Packages
      run: mvn -B deploy -DskipTests --file pom.xml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 发布到 Maven Central (可选，需要配置 OSSRH)
  publish-central:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 8 for Maven Central
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
        server-id: ossrh
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD
        gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
        gpg-passphrase: MAVEN_GPG_PASSPHRASE

    - name: Publish to Maven Central
      if: ${{ secrets.OSSRH_USERNAME != '' }}
      run: mvn -B deploy -DskipTests -Prelease --file pom.xml
      env:
        MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
